<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>번영손해사정 업무관리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232e3747'/%3E%3Cg transform='translate(10 8) scale(.8)'%3E%3Cpath d='M50 5 L88 22 V58 Q88 80 50 95 Q12 80 12 58 V22 Z M25 39 L50 24 L75 39' fill='none' stroke='%23e2bf6a' stroke-width='6'/%3E%3Cg fill='%23e2bf6a'%3E%3Crect x='21' y='45' width='58' height='6'/%3E%3Crect x='33' y='54' width='34' height='5'/%3E%3Crect x='37' y='62' width='5' height='24'/%3E%3Crect x='47.5' y='62' width='5' height='28'/%3E%3Crect x='58' y='62' width='5' height='24'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f1; --card:#ffffff; --card-2:#f9f9f7; --line:#e1e0d9; --line-2:#c3c2b7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:#e6f0fc;
  --s1:#2a78d6; --s2:#eb6834; --cmp:#b9b8b1;
  --good:#0ca30c; --good-ink:#006300; --good-wash:#e5f5e5;
  --warn:#fab219; --warn-ink:#8a5a00; --warn-wash:#fdf3dc;
  --crit:#d03b3b; --crit-ink:#b02a2a; --crit-wash:#fbe9e9;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 1px rgba(0,0,0,.03);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --card:#1a1a19; --card-2:#222220; --line:#2c2c2a; --line-2:#383835;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:#16263a;
    --s1:#3987e5; --s2:#d95926; --cmp:#55544f;
    --good-ink:#0ca30c; --good-wash:#14260f; --warn-ink:#fab219; --warn-wash:#2c2410; --crit-ink:#e66767; --crit-wash:#2e1616;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0d0d0d; --card:#1a1a19; --card-2:#222220; --line:#2c2c2a; --line-2:#383835;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:#16263a;
    --s1:#3987e5; --s2:#d95926; --cmp:#55544f;
    --good-ink:#0ca30c; --good-wash:#14260f; --warn-ink:#fab219; --warn-wash:#2c2410; --crit-ink:#e66767; --crit-wash:#2e1616;
    --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{margin:0 0 16px;text-align:center}
.brand img{display:block;width:100%;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.brand small{display:block;margin-top:8px;font-size:12px;color:var(--muted);letter-spacing:.06em}
nav.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none}
nav.side a:hover{background:var(--card-2)}
nav.side a.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
nav.side a .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
main{padding:24px 28px 60px;min-width:0;max-width:1320px}
.mainwrap{min-width:0}
#syncBar{padding:16px 28px 0;max-width:1320px}
#syncBar:empty{display:none}
#syncBar .banner{margin-bottom:0;flex-wrap:wrap}
.banner.crit{background:var(--crit-wash);color:var(--crit-ink)}
.banner.good{background:var(--good-wash);color:var(--good-ink)}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:22px;margin:0;letter-spacing:-.02em}
.head .sub{color:var(--muted);font-size:13px}
.head .sp{flex:1}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dan{color:var(--crit-ink);border-color:var(--crit-wash)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.file-ok{background:var(--good-wash);color:var(--good-ink);border-color:transparent;font-weight:600}
.btn.file-ok:hover{filter:brightness(.96)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .note{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-7-5{grid-template-columns:7fr 5fr}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--good-ink)} .down{color:var(--crit-ink)}
.mb{margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-weight:600;font-size:12.5px;color:var(--ink-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--card);position:sticky;top:0}
table.t th.sort{cursor:pointer}
table.t th.sort:hover{color:var(--ink)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:var(--card-2)}
table.t .r{text-align:right}
table.t.compact th,table.t.compact td{padding:8px 4px;font-size:12.5px}
table.t tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
.tw{overflow:auto;max-width:100%}
.tw.tall{max-height:calc(100vh - 230px)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.nowrap{white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.badge.good{background:var(--good-wash);color:var(--good-ink);border-color:transparent}
.badge.warn{background:var(--warn-wash);color:var(--warn-ink);border-color:transparent}
.badge.crit{background:var(--crit-wash);color:var(--crit-ink);border-color:transparent}
.badge.acc{background:var(--accent-wash);color:var(--accent-ink);border-color:transparent}
.stage{display:inline-flex;flex-direction:column;gap:3px;min-width:96px}
.stage .bar{display:flex;gap:2px}
.stage .bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stage .bar i.on{background:var(--accent)}
.stage.done .bar i.on{background:var(--good)}
.stage span{font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:6px 10px}
.filters input[type=search]{min-width:220px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin:-4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.chart .lbl{fill:var(--ink-2);font-size:11.5px;font-weight:600}
.chart .band{fill:var(--ink);opacity:0}
.chart .hit:hover+.band,.chart .band.on{opacity:.045}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
.tip b{display:block;margin-bottom:3px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:96px 1fr 118px;gap:10px;align-items:center;font-size:13px}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:14px;background:var(--card-2);border-radius:0 4px 4px 0;position:relative}
.hb.oth .tr b{background:var(--cmp)}
.hb .tr b{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb .vv{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hb .vv small{color:var(--muted);margin-left:4px}
.pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-bottom:14px}
.pipe:last-child{margin-bottom:0}
.pipe-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin:0 0 8px}
.pipe button.z{opacity:.55}
.pipe button{border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:left}
.pipe button:hover{border-color:var(--accent)}
.pipe .n{font-size:22px;font-weight:700;display:block}
.pipe .k{font-size:12px;color:var(--ink-2);line-height:1.35;display:block}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li .todo-cb{width:18px;height:18px;flex-shrink:0;margin:0;cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--card-2)}
.li .m{flex:1;min-width:0}
.li .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m small{color:var(--muted)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
dialog{border:0;border-radius:14px;padding:0;width:min(940px,96vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dlg-h h3{margin:0;font-size:17px;flex:1}
.dlg-b{padding:4px 20px 20px;overflow:auto;max-height:calc(92vh - 130px)}
.dlg-f{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--card)}
.dlg-f .sp{flex:1}
fieldset{border:0;padding:0;margin:16px 0 0}
legend{font-weight:700;font-size:14px;padding:0;margin-bottom:8px;display:flex;gap:8px;align-items:center;width:100%}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.fg label,.fg .fl{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);min-width:0}
.fg .w2{grid-column:span 2} .fg .w4{grid-column:span 4}
.fg input,.fg select,.fg textarea{border:1px solid var(--line-2);background:var(--card);border-radius:7px;padding:6px 9px;color:var(--ink);width:100%;min-width:0}
.fg input[type=checkbox]{width:auto;padding:0}
.fg .chk label{flex-direction:row;color:var(--ink);font-size:13px}
.fg input.num{text-align:right;font-variant-numeric:tabular-nums}
.fg .hint{font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px}
.chk label{display:flex;gap:6px;align-items:center;color:var(--ink);flex-direction:row}
.bill{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card-2)}
.bill-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;font-size:13px}
.bill-h .sp{flex:1}
.logs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.log{display:flex;gap:10px;font-size:13px;padding:6px 10px;background:var(--card-2);border-radius:7px;align-items:flex-start}
.log .d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.log .x{margin-left:auto;cursor:pointer;color:var(--muted);border:0;background:none}
.todos{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.todo-row{display:flex;gap:8px;align-items:center}
.todo-row [data-tf=text]{flex:1;min-width:0}
.todo-row [data-tf=due],.todo-row [data-tf=start]{width:140px;flex-shrink:0}
.todo-row label{flex-direction:row;align-items:center;gap:5px;flex-shrink:0;color:var(--ink);font-size:13px}
.todo-row .x{cursor:pointer;color:var(--muted);border:0;background:none;padding:4px 6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.on{opacity:1}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-wash);color:var(--warn-ink);border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:13px}
.banner .sp{flex:1}
input.cell{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
input.cell:hover,input.cell:focus{border-color:var(--line-2);background:var(--card)}
.docs{display:inline-flex;gap:4px}
/* 목록 탭(사건·수임계약·수금·매출): 창 크기에 맞춰 넓이·줄바꿈·간격 조절 */
main.wide{max-width:none}
main.wide table.t td{white-space:normal}
main.wide table.t td.r,main.wide table.t td.nowrap{white-space:nowrap}
main.wide table.t .docs{flex-wrap:wrap}
main.wide input.cell:not([style]){min-width:80px}
table.ct .na{min-width:130px;max-width:260px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:1500px){main.wide table.t th,main.wide table.t td{padding:7px 6px}main.wide table.t td{font-size:13px}}
@media (max-width:1250px){main.wide{padding-left:16px;padding-right:16px}main.wide table.t th,main.wide table.t td{padding:6px 4px;font-size:12.5px}main.wide table.t .docs span{padding:1px 4px}main.wide table.t th{white-space:normal;word-break:keep-all}main.wide table.t .btn.sm{white-space:normal;word-break:keep-all;line-height:1.3;min-width:76px}}
/* 대시보드 월별 매출액·입금액: 좁은 창에서는 1~6월 / 7~12월 두 줄로 */
table.dm-split{display:none}
table.dm-split tr:nth-child(4) th{padding-top:14px}
@media (max-width:1250px){#dmTable table:not(.dm-split){display:none}#dmTable table.dm-split{display:table}}
/* 부가세·소득세 신고표: 노트북 화면부터 칸을 좁게 */
@media (max-width:1400px){
  table.taxt th{white-space:normal;word-break:keep-all}
  table.taxt input.cell{padding:4px 3px}
  table.taxt input.cell[data-f="year"]{width:46px!important}table.taxt input.cell[data-f="label"]{width:64px!important}table.taxt input.cell[data-f="memo"]{min-width:56px!important}
  table.taxt td.acts{white-space:normal;min-width:76px}table.taxt td.acts .btn.sm{display:block;margin:2px 0;width:100%;white-space:normal;word-break:keep-all;line-height:1.3}}
.docs span{white-space:nowrap;font-size:11.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.docs span.ok{background:var(--good-wash);color:var(--good-ink);border-color:transparent}
.docs span.no{background:var(--crit-wash);color:var(--crit-ink);border-color:transparent}
.sumline{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:1180px){.kpis,.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;border-right:0;border-bottom:1px solid var(--line)}
  .brand,nav.side .foot{display:none}
  nav.side a{white-space:nowrap}
  main{padding:16px}
  #syncBar{padding:12px 16px 0}
  .g2,.g3,.g-7-5{grid-template-columns:1fr}
  .kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fg label.w4{grid-column:span 2}
}
@media print{nav.side,.btn,.filters{display:none!important}.app{display:block}}
</style>
</head>
<body>

<script>
'use strict';
const SEED = {"cases":[],"tax":[]}; // 인터넷 버전: 고객 정보 제거
const KEY = 'byeongyoung_adjust_v1';
const DONE = '종결(수수료 입금)';
const TRACKS = {
  '선임권': ['피보험자 면담 - 선임계약', '선임 동의서 제출', '현장조사', '현장보고서 제출', '서류 접수', '손해액 산정 및 중간보고서 작성', '중간보고서 제출', '피보험자 금액 안내', '최종서류 접수', '종결보고서 제출', DONE],
  '일반': ['피보험자 면담 - 선임계약', '현장조사', '서류 접수', '손해액 산정 및 제출', '피보험자 금액 안내', '보험사 협의', '최종서류 접수', '보수청구서 제출', DONE]
};
const TRACK_NAMES = Object.keys(TRACKS);
const stagesOf = c => TRACKS[c.track] || TRACKS['일반'];
const ALL_STAGES = [...new Set(Object.values(TRACKS).flat())];
const LONG_DAYS = 150;
const RECV = [['policy','보험증권'],['infoPoa','정보공개위임장'],['idCopy','신분증사본']];
const recvMissing = c => RECV.some(([k]) => !c.recv?.[k]);

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const won = v => Math.round(v || 0).toLocaleString('ko-KR');
const num = v => { const n = Number(String(v ?? '').replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pct = (v, d = 1) => (v * 100).toFixed(d) + '%';
function short(v) {
  v = Math.round(v || 0); const neg = v < 0; v = Math.abs(v); let s;
  if (v >= 1e8) { const e = Math.floor(v / 1e8), m = Math.round((v % 1e8) / 1e4); s = e + '억' + (m ? ' ' + m.toLocaleString() + '만' : ''); }
  else if (v >= 1e4) s = Math.round(v / 1e4).toLocaleString() + '만';
  else s = v.toLocaleString();
  return (neg ? '-' : '') + s;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2000); }
function fmtDate(d) { return d ? d.slice(2).replace(/-/g, '.') : ''; }

/* ---------- state ---------- */
let S;
function blankBilling(rate = 0, share = 1) { return { id: uid(), claim: 0, rate, share, fee: 0, vat: 0, extra: 0, expense: 0, expVat: 0, incomeTax: 0, billDate: '', paidDate: '', memo: '' }; }
const billTotal = b => b.fee + b.vat + (b.extra || 0);
function fromSeed() {
  const cases = SEED.cases.map(r => {
    const bills = (Array.isArray(r.billings) ? r.billings : [r.billings]).map(b => ({ ...blankBilling(), ...b, paidDate: b.paidDate || '', id: uid() }));
    const unpaid = bills.some(b => !b.paidDate && (b.fee || b.vat));
    const stage = r.closed && !unpaid ? DONE : unpaid ? '수수료 청구' : '현장조사';
    return {
      id: uid(), year: r.year, no: r.no, name: r.name || '', region: r.region || '', type: r.type || '',
      acceptDate: r.acceptDate || '', accidentDate: '', insurer: '', insurerContact: '', clientPhone: '', address: '',
      stage, nextAction: '', dueDate: '',
      contract: { date: r.acceptDate || '', rate: bills[0]?.rate || 0, share: bills[0]?.share ?? 1, partner: '', docs: {}, memo: '' },

function readForm() {
  const c = EDIT, f = $('#cform'); if (!f) return;

  f.querySelectorAll('.bill').forEach(el => { const b = c.billings[+el.dataset.bi]; el.querySelectorAll('[data-b]').forEach(i => { const k = i.dataset.b; b[k] = k === 'confirmed' ? i.checked : ['billDate', 'paidDate', 'memo'].includes(k) ? i.value : i.hasAttribute('data-pct') ? num(i.value) / 100 : num(i.value); }); });
}
$('#dlg').addEventListener('change', e => {

  if (e.target.dataset.f === 'track') { // 진행 구분 변경 → 같은 이름의 단계, 없으면 비슷한 진행률의 단계로
    const oldList = stagesOf(EDIT); // readForm 전이라 EDIT.track은 아직 이전 값
    const oldIdx = Math.max(0, oldList.indexOf(EDIT.stage));
    readForm(); const list = stagesOf(EDIT);
    if (!list.includes(EDIT.stage)) EDIT.stage = list[Math.round(oldIdx / (oldList.length - 1) * (list.length - 1))];
    drawKeep();
  }
  if (e.target.dataset.c === 'rate' || e.target.dataset.c === 'share') { // 계약 조건 → 미청구 건 기본값
    readForm(); for (const b of EDIT.billings) if (!b.fee && !b.paidDate) { b.rate = EDIT.contract.rate; b.share = EDIT.contract.share; } drawKeep();
  }

$('#dlg').addEventListener('input', e => {

  const pos = el.value.length - el.selectionStart; const v = num(el.value); el.value = el.value.trim() === '' || el.value === '-' ? el.value : won(v);
  const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p, p);
});
function drawKeep() { const sc = $('#cform')?.scrollTop; drawCase(); if (sc != null) $('#cform').scrollTop = sc; }
$('#dlg').addEventListener('keydown', e => { if (e.target.id === 'logText' && e.key === 'Enter') { e.preventDefault(); $('[data-act=addlog]').click(); } });
$('#dlg').addEventListener('click', e => {
  if (!EDIT) return;
  const t = e.target.closest('[data-act],[data-delbill],[data-dellog]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'close') { $('#dlg').close(); EDIT = null; return; }
  readForm();
  if (act === 'attachFile') { // 첨부는 파일을 폴더에 바로 복사하므로, 기존 사건이면 연결 정보도 바로 저장
    const id = EDIT.id;

    }).catch(err => alert('첨부하지 못했습니다: ' + err.message));

  }

    if (!confirm('계약서 파일 연결을 해제할까요?\n(파일은 OneDrive 계약서 폴더에 그대로 남습니다)')) return;

  }

  }

  if (t.dataset.dellog != null) { EDIT.logs.splice(+t.dataset.dellog, 1); drawKeep(); return; }
  if (act === 'addbill') { EDIT.billings.push(blankBilling(EDIT.contract.rate, EDIT.contract.share)); drawKeep(); return; }
  if (t.dataset.delbill != null) { if (confirm('이 청구 내역을 삭제할까요?')) { EDIT.billings.splice(+t.dataset.delbill, 1); drawKeep(); } return; }
  if (act === 'calc') { const b = EDIT.billings[+t.closest('.bill').dataset.bi]; b.fee = Math.round(b.claim * b.rate * b.share); b.vat = Math.round(b.fee * 0.1); drawKeep(); return; }
  if (act === 'delete') { if (confirm(`“${EDIT.name}” 사건을 삭제할까요? 되돌릴 수 없습니다.`)) { S.cases = S.cases.filter(c => c.id !== EDIT.id); save(); $('#dlg').close(); EDIT = null; render(); } return; }
  if (act === 'save') {
    if (!EDIT.name) { alert('계약자 / 사건명을 입력하세요.'); return; }
    const c = EDIT; delete c._new; syncTodos(c);
    if (c._leadId) { const l = leadsOf().find(x => x.id === c._leadId); if (l) { l.caseId = c.id; l.stage = '수임 성공'; } delete c._leadId; } // 영업 리드에서 등록한 사건
    if (c.acceptDate) c.year = +c.acceptDate.slice(0, 4);
    const s = sum(c);
    if (c.stage === DONE && c.billings.some(b => billTotal(b) && !isConfirmed(b))) {
      if (!confirm('아직 “예상 수수료”인 청구가 있습니다.\n확정 수수료를 입력하셨으면 [확인]을 눌러 현재 금액을 확정 수수료로 저장합니다.\n[취소]를 누르면 저장하지 않고 돌아갑니다.')) return;
      for (const b of c.billings) if (!isConfirmed(b)) { b.estFee ??= b.fee; b.estVat ??= b.vat; b.confirmed = true; }
    }
    if (s.allPaid && isOpen(c) && confirm(`모든 청구가 입금되었습니다. 단계를 “${DONE}”로 바꿀까요?`)) c.stage = DONE;
    const i = S.cases.findIndex(x => x.id === c.id);
    if (i >= 0) S.cases[i] = c; else { if (!c.no) c.no = String(S.cases.filter(x => caseYear(x) === caseYear(c)).length + 1); S.cases.push(c); c.logs.push({ date: c.acceptDate || todayStr(), text: '사건 수임' }); }
    save(); $('#dlg').close(); EDIT = null; render();
  }
});
$('#dlg').addEventListener('cancel', () => { EDIT = null; });

/* ---------- 인터넷 주소 버전 (태블릿·휴대폰) ----------
   https 주소로 열면 마이크로소프트 계정으로 로그인해서, OneDrive의 같은 데이터 파일(번영손해사정\번영손해사정_데이터.json)과
   계약서 폴더를 인터넷으로 읽고 쓴다. 파일 읽기·쓰기만 바꿔 끼우므로 저장 번호 비교·충돌 안내 등은 PC와 똑같이 동작한다.
   PC에서 파일을 직접 열 때(file://)는 이 부분을 쓰지 않는다. */
const WEB = location.protocol === 'https:';
const MS = {
  clientId: 'a7264a41-b1f7-43ae-8b7c-e7da26df99a4', // Azure 앱 등록 "번영손해사정 업무관리"의 애플리케이션(클라이언트) ID (비밀 아님)
  authority: 'https://login.microsoftonline.com/consumers/oauth2/v2.0', // 개인 마이크로소프트 계정
  scope: 'Files.ReadWrite offline_access openid profile',
  folder: '번영손해사정', dataFile: '번영손해사정_데이터.json', contractFolder: '계약서'
};
const MS_KEY = 'byeongyoung_ms';
const WEBST = { ready: false, loading: false, error: '' };
const msTok = () => { try { return JSON.parse(localStorage.getItem(MS_KEY) || 'null'); } catch { return null; } };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const msRedirect = () => location.origin + location.pathname;
const deviceName = () => /iPad|Tablet/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) ? '태블릿' : /Mobi|Android|iPhone/i.test(navigator.userAgent) ? '휴대폰' : '인터넷';
class LoginNeeded extends Error { constructor() { super('로그인이 필요합니다. 마이크로소프트 계정으로 다시 로그인해 주세요.'); this.name = 'LoginNeeded'; } }
async function msLogin() {
  if (!MS.clientId) return alert('마이크로소프트 등록 번호가 아직 설정되지 않았습니다.');
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem('ms_pkce', JSON.stringify({ verifier, state, hash: location.hash }));
  location.href = `${MS.authority}/authorize?` + new URLSearchParams({ client_id: MS.clientId, response_type: 'code', redirect_uri: msRedirect(), scope: MS.scope, code_challenge: challenge, code_challenge_method: 'S256', state, response_mode: 'query', prompt: 'select_account' });
}
async function msHandleRedirect() { // 로그인하고 돌아왔을 때 (?code=…)
  const p = new URLSearchParams(location.search);
  if (!p.get('code') && !p.get('error')) return;
  const saved = JSON.parse(sessionStorage.getItem('ms_pkce') || '{}'); sessionStorage.removeItem('ms_pkce');
  history.replaceState(null, '', msRedirect() + (saved.hash || ''));
  if (p.get('error')) throw new Error('로그인하지 못했습니다: ' + (p.get('error_description') || p.get('error')));
  if (!saved.state || saved.state !== p.get('state')) throw new Error('로그인 확인값이 맞지 않습니다. 다시 로그인해 주세요.');
  await msToken({ grant_type: 'authorization_code', code: p.get('code'), code_verifier: saved.verifier, redirect_uri: msRedirect() });
}
async function msToken(params) {
  const r = await fetch(`${MS.authority}/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: MS.clientId, scope: MS.scope, ...params }) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || '로그인 오류');
  let name = msTok()?.name || '';
  try { const c = JSON.parse(decodeURIComponent(escape(atob(j.id_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); name = c.name || c.preferred_username || name; } catch {}
  const t = { access: j.access_token, refresh: j.refresh_token || msTok()?.refresh, exp: Date.now() + (j.expires_in - 120) * 1000, name };
  localStorage.setItem(MS_KEY, JSON.stringify(t)); return t;
}
async function msAccess() { // 쓸 수 있는 출입증(토큰). 만료됐으면 새로 받고, 그것도 안 되면 다시 로그인
  const t = msTok(); if (!t) throw new LoginNeeded();
  if (Date.now() < t.exp) return t.access;
  try { return (await msToken({ grant_type: 'refresh_token', refresh_token: t.refresh })).access; }
  catch { localStorage.removeItem(MS_KEY); throw new LoginNeeded(); }
}
function msLogout() {
  if (S.meta?.dirty && !confirm('아직 OneDrive에 저장하지 못한 변경이 있습니다. 로그아웃하면 이 기기에서 사라집니다. 계속할까요?')) return;
  if (!confirm('로그아웃할까요?\n이 기기에 임시로 보관한 데이터도 함께 지웁니다. (OneDrive의 데이터는 그대로)')) return;
  try { localStorage.removeItem(MS_KEY); localStorage.removeItem(KEY); } catch {}
  location.href = msRedirect();
}
const gUrl = segs => 'https://graph.microsoft.com/v1.0/me/drive/root:/' + segs.map(encodeURIComponent).join('/');
async function graph(url, opt = {}) {
  const r = await fetch(url, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + await msAccess(), ...(opt.headers || {}) } });
  if (r.status === 401) { localStorage.removeItem(MS_KEY); throw new LoginNeeded(); }
  if (r.status === 404) { const e = new Error('OneDrive에 파일이 없습니다'); e.name = 'NotFoundError'; throw e; }
  if (!r.ok) throw new Error(`OneDrive 오류 (${r.status}) ${(await r.text()).slice(0, 150)}`);
  return r;
}
// PC의 파일 연결과 같은 모양으로 만든 OneDrive 파일 (getFile로 읽기, createWritable로 쓰기)
function graphFile(segs) {
  const url = gUrl(segs), name = segs[segs.length - 1];
  return {
    kind: 'file', name, queryPermission: async () => 'granted', requestPermission: async () => 'granted',
    async getFile() {
      const m = await (await graph(url)).json();
      const blob = await (await fetch(m['@microsoft.graph.downloadUrl'], { cache: 'no-store' })).blob();
      return new File([blob], name, { type: m.file?.mimeType || blob.type, lastModified: Date.parse(m.lastModifiedDateTime) || Date.now() });
    },
    async createWritable() {
      const parts = [];
      return { write: async d => { parts.push(d); }, close: async () => { await graph(url + ':/content', { method: 'PUT', body: new Blob(parts) }); } };
    }
  };
}
function graphDir(segs) {
  return {
    kind: 'directory', name: segs[segs.length - 1], queryPermission: async () => 'granted', requestPermission: async () => 'granted',
    async getFileHandle(n, opt = {}) { if (!opt.create) await graph(gUrl([...segs, n])); return graphFile([...segs, n]); } // 없으면 NotFoundError
  };
}
const pickLocalFile = () => new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.pdf,image/*'; i.onchange = () => res(i.files[0] || null); i.click(); });
async function webInit() {
  renderSyncUI();
  try { await msHandleRedirect(); } catch (e) { WEBST.error = e.message; }
  if (!pcName()) try { localStorage.setItem(PC_KEY, deviceName()); } catch {}
  DIR.handle = graphDir([MS.folder, MS.contractFolder]); DIR.state = 'ok';
  if (!msTok()) { render(); return; }
  await webLoad();
}
async function webLoad() { // 로그인한 뒤: OneDrive 데이터 파일을 불러와야 업무 화면을 보여 줌
  SYNC.handle = graphFile([MS.folder, MS.dataFile]); SYNC.baseRev = revOf(S); SYNC.state = 'ok'; SYNC.error = '';
  WEBST.loading = true; WEBST.error = ''; render();
  await syncTask(pullFromFile);
  WEBST.loading = false;
  if (SYNC.state === 'ok' || SYNC.state === 'conflict') WEBST.ready = true; else WEBST.error = SYNC.error;
  renderSyncUI(); render();
}
function webGateHtml() { // 로그인·첫 불러오기 전에는 업무 화면 대신 이 안내를 보여 줌
  const t = msTok();
  const body = !MS.clientId ? '<p>설정이 아직 끝나지 않았습니다. (마이크로소프트 등록 번호 없음)</p>'
    : WEBST.loading ? '<p>OneDrive에서 데이터를 불러오는 중입니다…</p>'
    : !t ? `<p>OneDrive의 데이터 파일을 쓰려면 마이크로소프트 계정으로 로그인해 주세요.<br><span class="muted">PC의 OneDrive와 같은 계정이어야 합니다.</span></p>
        <div class="fg" style="grid-template-columns:1fr;max-width:260px;margin:0 auto 14px;text-align:left"><label>이 기기 이름<input value="${esc(pcName())}" onchange="setPcName(this.value)" placeholder="예: 휴대폰, 태블릿"><span class="hint">어느 기기에서 저장했는지 기록할 때 씁니다</span></label></div>
        <button class="btn pri" onclick="msLogin()">마이크로소프트 계정으로 로그인</button>`
    : `<p class="down">데이터를 불러오지 못했습니다.<br>${esc(WEBST.error)}</p><button class="btn pri" onclick="webLoad()">다시 시도</button> <button class="btn" onclick="msLogin()">다시 로그인</button>`;
  return `<div class="card" style="max-width:440px;margin:40px auto;text-align:center"><h2 style="justify-content:center">번영손해사정 업무관리</h2>${WEBST.error && !t ? `<p class="down">${esc(WEBST.error)}</p>` : ''}${body}</div>`;
}
function webCardHtml() { // 백업·설정 탭의 OneDrive 칸 (인터넷 버전)
  const t = msTok(), m = S.meta || {};
  return `<div class="card mb"><h2>OneDrive 연결 (인터넷 버전) ${SYNC.state === 'ok' ? '<span class="badge good">✓ 동기화 중</span>' : SYNC.state === 'conflict' ? '<span class="badge crit">⚠ 충돌</span>' : '<span class="badge crit">⚠ 오류</span>'}</h2>
    <div class="fg" style="grid-template-columns:1fr;max-width:320px;margin-bottom:12px"><label>이 기기 이름 <input id="pcName" value="${esc(pcName())}" placeholder="예: 휴대폰, 태블릿" onchange="setPcName(this.value)"></label></div>
    <div class="tw"><table class="t"><tbody>
      <tr><td class="ink2">마이크로소프트 계정</td><td>${esc(t?.name || '-')}</td></tr>
      <tr><td class="ink2">데이터 파일</td><td>OneDrive › ${esc(MS.folder)} › <b>${esc(MS.dataFile)}</b></td></tr>
      <tr><td class="ink2">마지막 파일 저장</td><td>${m.savedAtIso ? `${esc(m.savedBy || '')} · ${fmtIso(m.savedAtIso)} (저장 번호 ${m.rev || 0})` : '<span class="muted">-</span>'}</td></tr>
      <tr><td class="ink2">마지막 확인</td><td>${SYNC.lastCheck || '<span class="muted">-</span>'}</td></tr>
      <tr><td class="ink2">계약서 폴더</td><td>OneDrive › ${esc(MS.folder)} › ${esc(MS.contractFolder)}</td></tr>
    </tbody></table></div>
    <p style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0"><button class="btn" onclick="syncCheckNow()">지금 최신 상태 확인</button><button class="btn dan" onclick="msLogout()">로그아웃</button></p>
    <p class="muted" style="font-size:12px;margin-bottom:0">로그인은 하루쯤 지나면 다시 해야 할 수 있습니다. 다른 사람과 같이 쓰는 기기에서는 다 쓴 뒤 로그아웃해 주세요.</p></div>`;
}

function updateCounts() {
  $('#cnt-open').textContent = S.cases.filter(isOpen).length;
  $('#cnt-unpaid').textContent = unpaidBills().length;
  $('#cnt-leads').textContent = leadsOf().filter(leadOpen).length || '';
}
function render() {
  const v = (location.hash.slice(1) || 'dashboard').split('/')[0];
  const view = views[v] ? v : 'dashboard';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  $('#main').classList.toggle('wide', ['dashboard', 'leads', 'cases', 'contracts', 'collect', 'revenue', 'tax'].includes(view));
  if (WEB && !WEBST.ready) { $('#main').innerHTML = webGateHtml(); return; } // 인터넷 버전: 로그인·불러오기 전
  $('#main').innerHTML = views[view]();
  views[view].after?.();
}
$('#main').addEventListener('click', collectClick);

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const v = location.hash.slice(1) || 'dashboard'; if (v === 'dashboard' || v === 'revenue') render(); }, 200); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
